plugins {
    id 'com.android.application'
}

// The pre-connection Android screen and the website use one copy of the route network and UI.
def routeAssets = layout.buildDirectory.dir('generated/routeAssets')
def bundleRouteMap = tasks.register('bundleRouteMap', Sync) {
    from(rootProject.file('server/static')) {
        include 'wayfinding.html', 'wayfinding.js', 'airport.css', 'passenger.css'
        into 'route'
    }
    into routeAssets
}

android {
    namespace 'kz.edu.airportcourse'
    compileSdk 37
    sourceSets.main.assets.srcDir(routeAssets.get().asFile)

    defaultConfig {
        applicationId 'kz.edu.airportcourse'
        minSdk 26
        targetSdk 37
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

tasks.named('preBuild').configure { dependsOn(bundleRouteMap) }

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.zxing:core:3.5.4'
}
